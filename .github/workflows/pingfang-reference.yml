name: pingfang-reference

on:
  push:
    branches:
      - codex/pingfang-coretext

jobs:
  coretext-reference:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect system PingFang
        run: |
          sw_vers
          system_profiler SPSoftwareDataType
      - name: Build CoreText reference generator
        run: swiftc tools/coretext_reference.swift -O -o out/coretext_reference
      - name: Generate system PingFang references
        run: >-
          out/coretext_reference
          --system-family "PingFang SC"
          --output out/coretext-pingfang
      - uses: actions/upload-artifact@v4
        with:
          name: coretext-pingfang-system
          path: out/coretext-pingfang
          if-no-files-found: error
